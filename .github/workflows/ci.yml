name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn yfinance pytest boto3 requests

      - name: 🛡️ Syntax Check (All Python Files)
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('.').rglob('*.py')):
              if 'lib/' in str(f) or '__pycache__' in str(f):
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'✅ Syntax OK — {len(list(pathlib.Path(\".\").rglob(\"*.py\")))} files checked')
          "

      - name: 🧪 Run Automated Unit Tests
        run: |
          pytest tests/ -v

      - name: 🐳 Validate Docker Compose Architecture
        run: |
          docker compose config --quiet
