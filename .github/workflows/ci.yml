name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn yfinance pytest

      - name: 🛡️ Compile & Syntax Check (All DAGs & Dashboard)
        run: |
          python -m py_compile dags/*.py dashboard/app.py tests/*.py

      - name: 🧪 Run Automated Unit Tests
        run: |
          pytest tests/ -v

      - name: 🐳 Validate Docker Compose Architecture
        run: |
          docker compose config --quiet
