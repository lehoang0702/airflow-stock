name: airflow-stock

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:13
    mem_limit: 1024m
    cpus: 1.0
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
      - POSTGRES_MULTIPLE_DATABASES=mlflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 2. MinIO (Lưu trữ file và Web UI xem file)
  minio:
    image: minio/minio:latest
    mem_limit: 1024m
    cpus: 1.0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Giao diện Web MinIO
    volumes:
      - ./minio_data:/data:z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Khởi tạo DB & tạo tài khoản admin cho Airflow
  airflow-init:
    image: custom-airflow-xgboost:latest
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      - &minio_connection 'AIRFLOW_CONN_MINIO_CONN={"conn_type":"aws","extra":{"endpoint_url":"${MINIO_ENDPOINT_URL:-http://minio:9000}","region_name":"us-east-1"}}'
      - &minio_access_key AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - &minio_secret_key AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/tmp/airflow-init-logs
      - AIRFLOW__SCHEDULER__CHILD_PROCESS_LOG_DIRECTORY=/tmp/airflow-init-logs/scheduler
      - AIRFLOW__LOGGING__DAG_PROCESSOR_MANAGER_LOG_LOCATION=/tmp/airflow-init-logs/dag_processor_manager.log
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-admin}
      - &no_runtime_install _PIP_ADDITIONAL_REQUIREMENTS=
    command: version

  # 4. Airflow Webserver (Giao diện điều khiển Airflow)
  airflow-webserver:
    image: custom-airflow-xgboost:latest
    mem_limit: 1024m
    cpus: 1.0
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    command: bash -c "rm -f /opt/airflow/airflow-webserver.pid && airflow webserver"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      - *minio_connection
      - *minio_access_key
      - *minio_secret_key
      - *no_runtime_install
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-secret_key_fedora_12345}
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
      - ./plugins:/opt/airflow/plugins:z
    restart: always

  # 5. Airflow Scheduler (Bộ lập lịch chạy ngầm)
  airflow-scheduler:
    image: custom-airflow-xgboost:latest
    mem_limit: 2560m
    cpus: 2.0
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      - *minio_connection
      - *minio_access_key
      - *minio_secret_key
      - *no_runtime_install
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
      - ./plugins:/opt/airflow/plugins:z
    restart: always

  # 6. Quantum Interactive Web Dashboard (Cổng 8050)
  dashboard:
    image: custom-airflow-xgboost:latest
    mem_limit: 1536m
    cpus: 1.5
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8050:8050"
    working_dir: /opt/airflow
    command: python /opt/airflow/dashboard/app.py
    environment:
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - *no_runtime_install
    env_file:
      - .env
    volumes:
      - ./dashboard:/opt/airflow/dashboard:z
      - ./minio_data:/opt/airflow/minio_data:z
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
      - ./tests:/opt/airflow/tests:ro
    restart: always

  # 7. MLflow Tracking Server (Cổng 5000)
  mlflow-server:
    image: custom-airflow-xgboost:latest
    mem_limit: 2048m
    cpus: 1.5
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/tmp/airflow-mlflow-logs
      - AIRFLOW__SCHEDULER__CHILD_PROCESS_LOG_DIRECTORY=/tmp/airflow-mlflow-logs/scheduler
      - AIRFLOW__LOGGING__DAG_PROCESSOR_MANAGER_LOG_LOCATION=/tmp/airflow-mlflow-logs/dag_processor_manager.log
      - MLFLOW_S3_ENDPOINT_URL=${MINIO_ENDPOINT_URL:-http://minio:9000}
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - *no_runtime_install
    command:
      - bash
      - -ec
      - |
        backend_uri="postgresql+psycopg2://$${POSTGRES_USER:-airflow}:$${POSTGRES_PASSWORD:-airflow}@postgres/mlflow"
        mlflow db upgrade "$$backend_uri"
        exec mlflow server --host 0.0.0.0 --port 5000 --workers 2 \
          --backend-store-uri "$$backend_uri" \
          --default-artifact-root s3://stock-data/mlruns --allowed-hosts '*'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
    name: airflow-minio_postgres_data

