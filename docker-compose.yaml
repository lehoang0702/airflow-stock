name: airflow-stock

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
      - POSTGRES_MULTIPLE_DATABASES=mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 2. MinIO (Lưu trữ file và Web UI xem file)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Giao diện Web MinIO
    volumes:
      - ./minio_data:/data:z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Khởi tạo DB & tạo tài khoản admin cho Airflow
  airflow-init:
    image: custom-airflow-xgboost:latest
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    command: bash -c "airflow db migrate && airflow users create --username $${AIRFLOW_ADMIN_USER:-admin} --password $${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  # 4. Airflow Webserver (Giao diện điều khiển Airflow)
  airflow-webserver:
    image: custom-airflow-xgboost:latest
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"
    command: webserver
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-secret_key_fedora_12345}
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
      - ./plugins:/opt/airflow/plugins:z
    restart: always

  # 5. Airflow Scheduler (Bộ lập lịch chạy ngầm)
  airflow-scheduler:
    image: custom-airflow-xgboost:latest
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      - airflow-init
    command: scheduler
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
      - ./plugins:/opt/airflow/plugins:z
    restart: always

  # 6. Quantum Interactive Web Dashboard (Cổng 8050)
  dashboard:
    image: custom-airflow-xgboost:latest
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8050:8050"
    working_dir: /opt/airflow
    command: python /opt/airflow/dashboard/app.py
    env_file:
      - .env
    volumes:
      - ./dashboard:/opt/airflow/dashboard:z
      - ./minio_data:/opt/airflow/minio_data:z
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
    restart: always

  # 7. MLflow Tracking Server (Cổng 5000)
  mlflow-server:
    image: custom-airflow-xgboost:latest
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      bash -c "mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://airflow:airflow@postgres/mlflow
      --default-artifact-root s3://stock-data/mlruns
      --allowed-hosts '*'"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
    name: airflow-minio_postgres_data



